<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="lib/leaflet.css" />
  <style>
    body { width: 380px; font-family: sans-serif; margin: 0; background: #f4f4f4; }
    #header { background: #0056b3; color: white; padding: 10px; text-align: center; font-weight: bold; }
    .search-box { padding: 10px; background: white; border-bottom: 1px solid #ddd; }
    #searchInput { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    #results { position: absolute; width: 360px; background: white; z-index: 1000; border: 1px solid #ddd; display: none; max-height: 150px; overflow-y: auto; }
    .res-item { padding: 8px; cursor: pointer; border-bottom: 1px solid #eee; font-size: 12px; }
    .res-item:hover { background: #f0f0f0; }
    #map { height: 200px; width: 100%; }
    .list { padding: 10px; max-height: 100px; overflow-y: auto; }
    .city-item { display: flex; justify-content: space-between; background: white; padding: 5px 10px; margin-bottom: 5px; border-radius: 4px; font-size: 12px; align-items: center; }
    .btn-del { background: #ff4d4d; color: white; border: none; padding: 2px 6px; border-radius: 3px; cursor: pointer; }
    .footer { padding: 10px; }
    #btnCalc { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div id="header">Minhas Bases</div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Buscar cidade (Ex: Guaçuí, ES)...">
    <div id="results"></div>
  </div>
  <div id="map"></div>
  <div id="cityList" class="list"></div>
  <div class="footer">
    <button id="btnCalc">CALCULAR DISTÂNCIAS</button>
    <div id="status" role="status"></div>
  </div>
  <script src="lib/leaflet.js"></script>
  <script src="popup.js"></script>
</body>
</html>
